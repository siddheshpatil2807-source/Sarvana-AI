
name: Build Sarvana AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --project-name sarvana_ai --platforms android temp_app

      - name: Add Sarvana app code
        run: |
          cp pubspec.yaml temp_app/pubspec.yaml
          cp -r lib temp_app/lib

      - name: Build APK
        working-directory: temp_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarvana-AI-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk


